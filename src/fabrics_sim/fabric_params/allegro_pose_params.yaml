                              0.02, 0.02, 0.02, 0.02, 0.02,
                              0.02, 0.02, 0.02, 0.02, 0.02,
                              0.02, 0.02, 0.02, 0.02, 0.02,
                              0.02, 0.02, 0.02,
                              0.02, 0.02, 0.02 ]
    collision_sphere_pairs: [ ]
