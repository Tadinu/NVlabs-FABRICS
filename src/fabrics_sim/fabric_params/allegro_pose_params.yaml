      # FINGERS: Thumb >< Others
      [ "thumb_link_1", "index_link_1" ],
      [ "thumb_link_2", "index_link_2" ],
      [ "thumb_link_3", "index_link_3" ],
      [ "thumb_link_1", "middle_link_1" ],
      [ "thumb_link_2", "middle_link_2" ],
      [ "thumb_link_3", "middle_link_3" ],
      [ "thumb_link_1", "ring_link_1" ],
      [ "thumb_link_2", "ring_link_2" ],
      [ "thumb_link_3", "ring_link_3" ],
      # FINGERS: Index >< Middle >< Ring
      [ "index_link_1", "middle_link_1" ],
      [ "index_link_2", "middle_link_2" ],
      [ "index_link_3", "middle_link_3" ],
      [ "middle_link_1", "ring_link_1" ],
      [ "middle_link_2", "ring_link_2" ],
      [ "middle_link_3", "ring_link_3" ]

    ]
